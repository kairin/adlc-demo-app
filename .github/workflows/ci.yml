name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every check runs even if an earlier one fails, so the summary shows all of them.
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck
      - name: Test
        if: ${{ !cancelled() }}
        run: pnpm test
      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm build
